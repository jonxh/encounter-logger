plugins {
	id 'java'
}

// RuneLite's client pulls LWJGL with natives for ALL platforms. On Windows,
// lwjgl-opengl-natives-linux-arm64 doesn't exist in Maven Central for 3.3.2,
// causing resolution failures. Configure the run task to use lenient resolution
// so missing platform natives are skipped rather than failing the build.

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.osrssim.encounterlogger.EncounterLoggerPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.osrssim.encounterlogger'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	// Resolve artifacts leniently so missing LWJGL platform natives (e.g.
	// lwjgl-opengl-natives-linux-arm64, which doesn't exist in Maven Central
	// for 3.3.2) are skipped rather than failing the build on Windows.
	def lenientClasspath = configurations.testRuntimeClasspath
		.resolvedConfiguration
		.lenientConfiguration
		.artifacts
		.collect { it.file }

	// Include compiled classes AND resources from both source sets
	def ownOutputs = [sourceSets.main.output, sourceSets.test.output]
		.collectMany { it.files.toList() }

	classpath = files(lenientClasspath + ownOutputs)

	mainClass = pluginMainClass
	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
